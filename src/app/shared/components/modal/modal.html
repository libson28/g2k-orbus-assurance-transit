<!-- Backdrop: sits below the persistent header/nav (z-40) so global navigation
     always stays clickable even while a popup is open on the current page. -->
<div
  class="fixed inset-0 z-30 bg-brand-navy/40"
  [style.opacity]="open() ? 1 : 0"
  [style.transition]="ready() ? 'opacity 300ms cubic-bezier(0.4,0,0.2,1)' : 'none'"
  [class.pointer-events-none]="!open()"
  (click)="close()"
></div>

<!-- Drawer: independent high z-index so its own content stays above the header. -->
<aside
  (click)="stop($event)"
  class="fixed right-0 top-0 z-[60] flex h-full w-full flex-col bg-white shadow-2xl ease-out"
  [class]="maxWidth()"
  [style.transform]="open() ? 'translateX(0)' : 'translateX(100%)'"
  [style.transition]="ready() ? 'transform 300ms cubic-bezier(0,0,0.2,1)' : 'none'"
  [class.pointer-events-none]="!open()"
>
  @if (title()) {
    <div class="flex items-start justify-between border-b border-slate-100 px-6 py-5">
      <div>
        <p class="text-base font-bold text-brand-navy">{{ title() }}</p>
        @if (subtitle()) {
          <p class="mt-1 text-sm text-slate-500">{{ subtitle() }}</p>
        }
      </div>
      <button type="button" (click)="close()" class="text-slate-400 hover:text-brand-navy" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" class="h-6 w-6">
          <path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M6 6l12 12M18 6 6 18" />
        </svg>
      </button>
    </div>
  }

  <div class="flex-1 overflow-y-auto px-6 py-5">
    <ng-content />
  </div>
</aside>
