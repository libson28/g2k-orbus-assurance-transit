<div class="overflow-x-auto" [class.rounded-2xl]="!bare()" [class.border]="!bare()" [class.border-slate-100]="!bare()" [class.bg-white]="!bare()">
  <table class="w-full text-left text-sm" [style.min-width.px]="minWidth()">
    <thead>
      <tr class="text-xs uppercase tracking-wide text-slate-400 bg-slate-50" [class.border-b]="!bare()" [class.border-y]="bare()" [class.border-slate-100]="true">
        @for (col of columns(); track col.key) {
          <th class="px-5 py-3 font-medium first:pl-5" [class.text-right]="col.align === 'right'">
            @if (col.sortable) {
              <button
                type="button"
                (click)="onSort(col.key)"
                class="inline-flex items-center gap-1 hover:text-brand-navy"
                [class.ml-auto]="col.align === 'right'"
              >
                {{ col.label }}
                <svg viewBox="0 0 24 24" fill="none" class="h-3 w-3" [class.text-brand-navy]="sortKey() === col.key">
                  <path
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    [attr.d]="sortKey() === col.key && !sortAsc() ? 'm6 9 6 6 6-6' : 'm6 15 6-6 6 6'"
                  />
                </svg>
              </button>
            } @else {
              {{ col.label }}
            }
          </th>
        }
      </tr>
    </thead>
    <ng-content />
  </table>
</div>
