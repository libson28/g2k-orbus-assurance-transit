<app-auth-shell
  badge="Sécurité 🔒"
  title="Choisissez un nouveau mot de passe"
  [subtitle]="'Bonjour ' + userName() + ', ce compte a été créé avec un mot de passe provisoire. Définissez votre propre mot de passe pour continuer.'"
>
  <h2 class="text-2xl font-bold text-brand-navy">Nouveau mot de passe</h2>

  <form class="mt-8 space-y-5" (submit)="$event.preventDefault(); onSubmit()">
    <div>
      <label for="new-password" class="text-sm font-medium text-brand-navy">Nouveau mot de passe</label>
      <div class="relative mt-2">
        <input
          id="new-password"
          [type]="passwordVisible() ? 'text' : 'password'"
          autocomplete="new-password"
          placeholder="••••••••••••"
          [value]="newPassword()"
          (input)="onNewPasswordInput($event)"
          class="w-full rounded-xl border bg-slate-50 px-4 py-3 pr-11 text-sm text-brand-navy placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-blue/20"
          [class]="touched() && !lengthValid() ? 'border-rose-300 focus:border-rose-400' : 'border-slate-200 focus:border-brand-blue'"
        />
        <button
          type="button"
          (click)="togglePasswordVisibility()"
          class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-slate-400 hover:text-brand-navy"
          [attr.aria-label]="passwordVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
        >
          @if (passwordVisible()) {
            <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5">
              <path stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5">
              <path stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
          }
        </button>
      </div>
      @if (touched() && !lengthValid()) {
        <p class="mt-1.5 text-xs text-rose-500">12 caractères minimum.</p>
      } @else {
        <p class="mt-1.5 text-[11px] leading-snug text-slate-400">12 caractères minimum.</p>
      }
    </div>

    <div>
      <label for="confirm-password" class="text-sm font-medium text-brand-navy">Confirmer le mot de passe</label>
      <input
        id="confirm-password"
        type="password"
        autocomplete="new-password"
        placeholder="••••••••••••"
        [value]="confirmPassword()"
        (input)="onConfirmPasswordInput($event)"
        class="mt-2 w-full rounded-xl border bg-slate-50 px-4 py-3 text-sm text-brand-navy placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-blue/20"
        [class]="touched() && !matchValid() ? 'border-rose-300 focus:border-rose-400' : 'border-slate-200 focus:border-brand-blue'"
      />
      @if (touched() && !matchValid()) {
        <p class="mt-1.5 text-xs text-rose-500">Les mots de passe ne correspondent pas.</p>
      }
    </div>

    <button
      type="submit"
      class="w-full rounded-xl bg-[#00008F] py-3.5 text-sm font-semibold text-white transition-colors hover:bg-[#00008F]/90"
    >
      Valider et continuer
    </button>
  </form>
</app-auth-shell>
