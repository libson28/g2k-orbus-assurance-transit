<app-auth-shell
  badge="Mot de passe oublié 🔑"
  title="Réinitialisez votre accès"
  subtitle="Indiquez l'adresse email associée à votre compte pour recevoir un lien de réinitialisation."
>
  <h2 class="text-2xl font-bold text-brand-navy">Mot de passe oublié</h2>
  <p class="mt-2 text-sm text-slate-500">
    Nous vous enverrons un lien pour choisir un nouveau mot de passe.
  </p>

  <form class="mt-8 space-y-5" (submit)="onSubmit($event)">
    <div>
      <label for="reset-email" class="text-sm font-medium text-brand-navy">Email</label>
      <input
        id="reset-email"
        name="reset-email"
        type="email"
        autocomplete="email"
        placeholder="vous@entreprise.sn"
        class="mt-2 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-brand-navy placeholder:text-slate-400 focus:border-brand-blue focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-blue/20"
      />
    </div>

    <button
      type="submit"
      class="w-full rounded-xl bg-[#00008F] py-3.5 text-sm font-semibold text-white transition-colors hover:bg-[#00008F]/90"
    >
      Envoyer le lien
    </button>

    <p class="text-center text-sm text-slate-500">
      <a routerLink="/auth/login" class="inline-flex items-center gap-1 font-semibold text-brand-blue hover:underline">
        <svg viewBox="0 0 24 24" fill="none" class="h-4 w-4">
          <path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
        Retour à la connexion
      </a>
    </p>
  </form>
</app-auth-shell>
