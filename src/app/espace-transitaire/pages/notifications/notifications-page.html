<div class="px-6 py-6">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-[#00008F]">Notifications</h1>
      <p class="mt-1 text-sm text-slate-500">Les événements récents qui vous concernent. Vous les retrouvez aussi depuis la cloche, en haut de page.</p>
    </div>
    <button
      type="button"
      (click)="markAllRead()"
      [disabled]="!hasUnread()"
      class="cursor-pointer rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-brand-navy transition-colors hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40"
    >
      Tout marquer comme lu
    </button>
  </div>

  <div class="mt-6 divide-y divide-slate-100 rounded-2xl border border-slate-100 bg-white">
    @for (n of notifications(); track n.id) {
      <div class="flex items-start gap-3 px-5 py-4" [class.bg-[#1F5DA8]/[0.03]]="isUnread(n)">
        <button type="button" (click)="open(n)" class="flex min-w-0 flex-1 cursor-pointer items-start gap-3 text-left">
          <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full" [class]="style(n.kind).tint">
            <svg viewBox="0 0 24 24" fill="none" class="h-4 w-4" aria-hidden="true">
              <path stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" [attr.d]="style(n.kind).iconPath" />
            </svg>
          </span>
          <span class="min-w-0 flex-1">
            <span class="flex items-center gap-2">
              <span class="text-sm text-brand-navy" [class]="isUnread(n) ? 'font-semibold' : 'font-medium'">{{ n.title }}</span>
              @if (isUnread(n)) {
                <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-[#6BAF00]" aria-label="Non lue"></span>
              }
            </span>
            <span class="mt-0.5 block text-sm text-slate-500">{{ n.detail }}</span>
          </span>
        </button>
        <span class="shrink-0 pt-0.5 text-xs text-slate-400">{{ ago(n.createdAt) }}</span>
        <button
          type="button"
          (click)="dismiss(n.id)"
          class="shrink-0 cursor-pointer rounded-md p-1 text-slate-300 transition-colors hover:bg-slate-100 hover:text-slate-500"
          aria-label="Supprimer la notification"
        >
          <svg viewBox="0 0 24 24" fill="none" class="h-4 w-4" aria-hidden="true">
            <path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
    } @empty {
      <p class="px-5 py-12 text-center text-sm text-slate-400">Aucune notification pour le moment.</p>
    }
  </div>
</div>
